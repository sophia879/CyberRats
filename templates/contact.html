<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Fale Conosco - Cyber Rats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="header">
    <div class="container">
        <h2>Fale Conosco</h2>
        <a href="{{ url_for('home') }}" class="btn">Voltar</a>
    </div>
</header>

<section class="contact-section">
    <div class="contact-container">

        <h1>Fale com nossos especialistas</h1>
        <p>Estamos prontos para ajudar sua empresa a se proteger contra ameaças digitais.</p>

        <form class="contact-form">

            <input type="text" placeholder="Nome" required>
            <input type="email" placeholder="E-mail corporativo" required>
            <input type="text" placeholder="Empresa" required>

            <textarea rows="5" placeholder="Como podemos ajudar?"></textarea>

            <button type="submit" class="btn">Enviar mensagem</button>

        </form>

        <div class="contact-info">
            <p>📧 contato@cyberrats.com.br</p>
            <p>📱 (11) 99999-9999</p>
            <p>Resposta em até 24h úteis</p>
        </div>

    </div>
</section>

</body>
</html>
